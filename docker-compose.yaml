services:
  valkey:
    image: valkey/valkey:9.1.1-alpine
    ports:
      - 6379:6379
    volumes:
      - valkey_data:/data
    networks:
      - starlight

  postgresql:
    image: pgvector/pgvector:pg17-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-starlight-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-starlight}
      POSTGRES_DB: ${POSTGRES_DB:-starlight}
    ports:
      - 5432:5432
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    networks:
      - starlight
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    env_file:
      - apps/server/.env
    depends_on:
      - valkey
      - postgresql
    networks:
      - starlight

  starlight-bot:
    build:
      context: .
      dockerfile: apps/starlight/Dockerfile
    env_file:
      - apps/starlight/.env
    depends_on:
      valkey:
        condition: service_started
      postgresql:
        condition: service_started
      hindsight:
        condition: service_healthy
    networks:
      - starlight

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file:
      - apps/web/.env
    ports:
      - 3000:3000
    depends_on:
      - postgresql
    networks:
      - starlight

  classification:
    build:
      context: classification
      dockerfile: Dockerfile
    env_file:
      - classification/.env
    environment:
      ENABLE_RERANKER: "true"
      ENABLE_TEXT_EMBEDDINGS: "true"
    ports:
      - 8081:8000
    networks:
      - starlight
    healthcheck:
      test:
        [
          "CMD",
          "/code/.venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)",
        ]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 300s

  hindsight:
    image: ghcr.io/vectorize-io/hindsight:0.9.1
    environment:
      HINDSIGHT_API_DATABASE_URL: postgresql://${POSTGRES_USER:-starlight-admin}:${POSTGRES_PASSWORD:-starlight}@postgresql:5432/${POSTGRES_DB:-starlight}
      HINDSIGHT_API_DATABASE_SCHEMA: hindsight
      HINDSIGHT_API_VECTOR_EXTENSION: pgvector
      HINDSIGHT_API_WORKER_ID: hindsight
      HINDSIGHT_API_STORE_DOCUMENT_TEXT: "false"
      HINDSIGHT_API_TENANT_EXTENSION: hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension
      HINDSIGHT_API_TENANT_API_KEY: ${HINDSIGHT_API_KEY:?HINDSIGHT_API_KEY is required}
      HINDSIGHT_API_LLM_PROVIDER: openai
      HINDSIGHT_API_LLM_BASE_URL: https://openrouter.ai/api/v1
      HINDSIGHT_API_LLM_API_KEY: ${OPENROUTER_API_KEY:?OPENROUTER_API_KEY is required}
      HINDSIGHT_API_LLM_MODEL: google/gemini-3.7-flash
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: openai
      HINDSIGHT_API_EMBEDDINGS_OPENAI_BASE_URL: http://classification:8000/v1/openai
      HINDSIGHT_API_EMBEDDINGS_OPENAI_API_KEY: ${CLASSIFICATION_API_TOKEN:?CLASSIFICATION_API_TOKEN is required}
      HINDSIGHT_API_EMBEDDINGS_OPENAI_MODEL: BAAI/bge-m3
      HINDSIGHT_API_EMBEDDINGS_OPENAI_BATCH_SIZE: "64"
      HINDSIGHT_API_RERANKER_PROVIDER: cohere
      HINDSIGHT_API_COHERE_API_KEY: ${CLASSIFICATION_API_TOKEN:?CLASSIFICATION_API_TOKEN is required}
      HINDSIGHT_API_RERANKER_COHERE_BASE_URL: http://classification:8000/v1/rerank
      HINDSIGHT_API_RERANKER_COHERE_MODEL: BAAI/bge-reranker-v2-m3
    depends_on:
      postgresql:
        condition: service_healthy
      classification:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8888/health"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 300s
    networks:
      - starlight
    restart: unless-stopped

volumes:
  valkey_data:
  postgresql_data:

networks:
  starlight:
    driver: bridge
