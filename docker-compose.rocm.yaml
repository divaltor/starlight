# Dokploy must deploy this as "Docker Compose", not "Stack", because Swarm
# services do not support direct AMD device mappings.
services:
  classification:
    build:
      context: classification
      dockerfile: Dockerfile
    env_file:
      - ${CLASSIFICATION_ENV_FILE:-.env}
    environment:
      CLASSIFICATION_API_TOKEN: ${CLASSIFICATION_API_TOKEN:?CLASSIFICATION_API_TOKEN is required}
      MODEL_DEVICE: cuda
      TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL: "1"
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri/renderD128:/dev/dri/renderD128
    # GPU device nodes are root:render 660 on the host; grant the non-root
    # container user the host render group (gid 992 here, `getent group render`).
    group_add:
      - "992"
    security_opt:
      - seccomp=unconfined
    expose:
      - 8000
    healthcheck:
      test:
        [
          "CMD",
          "/code/.venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)",
        ]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 300s
    volumes:
      - classification_models:/cache/huggingface
    restart: unless-stopped

volumes:
  classification_models:
