services:
  classification:
    environment:
      ENABLE_RERANKER: "true"
      ENABLE_TEXT_EMBEDDINGS: "true"

  starlight-bot:
    depends_on:
      hindsight:
        condition: service_started

  hindsight:
    image: ghcr.io/vectorize-io/hindsight:0.9.1
    environment:
      HINDSIGHT_API_DATABASE_URL: postgresql://${POSTGRES_USER:-starlight-admin}:${POSTGRES_PASSWORD:-starlight}@postgresql:5432/${POSTGRES_DB:-starlight}
      HINDSIGHT_API_DATABASE_SCHEMA: hindsight
      HINDSIGHT_API_VECTOR_EXTENSION: pgvector
      HINDSIGHT_API_WORKER_ID: hindsight
      HINDSIGHT_API_STORE_DOCUMENT_TEXT: "false"
      HINDSIGHT_API_TENANT_EXTENSION: hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension
      HINDSIGHT_API_TENANT_API_KEY: ${HINDSIGHT_API_KEY:?HINDSIGHT_API_KEY is required}
      HINDSIGHT_API_LLM_PROVIDER: openai
      HINDSIGHT_API_LLM_BASE_URL: https://openrouter.ai/api/v1
      HINDSIGHT_API_LLM_API_KEY: ${OPENROUTER_API_KEY:?OPENROUTER_API_KEY is required}
      HINDSIGHT_API_LLM_MODEL: google/gemini-3.7-flash
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: openai
      HINDSIGHT_API_EMBEDDINGS_OPENAI_BASE_URL: http://classification:8000/v1/openai
      HINDSIGHT_API_EMBEDDINGS_OPENAI_API_KEY: ${CLASSIFICATION_API_TOKEN:?CLASSIFICATION_API_TOKEN is required}
      HINDSIGHT_API_EMBEDDINGS_OPENAI_MODEL: sergeyzh/BERTA
      HINDSIGHT_API_RERANKER_PROVIDER: cohere
      HINDSIGHT_API_COHERE_API_KEY: ${CLASSIFICATION_API_TOKEN:?CLASSIFICATION_API_TOKEN is required}
      HINDSIGHT_API_RERANKER_COHERE_BASE_URL: http://classification:8000/v1/rerank
      HINDSIGHT_API_RERANKER_COHERE_MODEL: jinaai/jina-reranker-v2-base-multilingual
    depends_on:
      - postgresql
      - classification
    networks:
      - starlight
    restart: unless-stopped
